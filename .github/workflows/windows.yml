name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --locked -- --test-threads=1
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test development tools
        run: cargo test --workspace --features dev-tools --locked -- --test-threads=1
      - name: Test installer distribution
        run: cargo test --workspace --features installer --locked -- --test-threads=1
      - name: Clippy installer distribution
        run: cargo clippy --workspace --all-targets --features installer --locked -- -D warnings
      - name: Build
        run: cargo build --release --locked
      - name: Verify Windows VERSIONINFO
        shell: pwsh
        run: ./scripts/verify-version-info.ps1
      - name: Verify embedded license notices
        shell: pwsh
        run: |
          $binary = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes('target/release/alcmute.exe'))
          foreach ($path in @('LICENSE')) {
            if (-not $binary.Contains([IO.File]::ReadAllText($path))) {
              throw "Missing embedded license text: $path"
            }
          }
          $process = Start-Process -FilePath target/release/alcmute.exe -ArgumentList '--verify-licenses' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compressed license verification failed' }
          if ($binary.Contains('/alcmute/test/')) {
            throw 'Development OSC endpoints found in production binary'
          }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: alcmute-windows
          path: target/release/alcmute.exe
          if-no-files-found: error
      - name: Build distribution packages
        shell: pwsh
        run: ./scripts/package.ps1 -Iscc "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
      - name: Verify installer preflight
        shell: pwsh
        run: ./scripts/verify-install-preflight.ps1 -Executable dist/build/installer/alcmute.exe
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distribution
          path: |
            dist/AlcMute-*-Setup.exe
            dist/AlcMute-*-Portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: distribution
          path: dist
      - name: Upload draft release for explicit version tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag/version mismatch' }
          $notesJson = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Release notes generation failed' }
          $notes = ($notesJson | ConvertFrom-Json).body
          $assetRoot = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_REF_NAME/assets/img"
          $badge = '<a href="https://slint.dev/"><picture><source media="(prefers-color-scheme: dark)" srcset="' + $assetRoot + '/MadeWithSlint-logo-dark.svg"><img alt="#MadeWithSlint" src="' + $assetRoot + '/MadeWithSlint-logo-light.svg" width="212" height="97"></picture></a>'
          $notesPath = Join-Path $env:RUNNER_TEMP 'alcmute-release-notes.md'
          [IO.File]::WriteAllText($notesPath, "$notes`n`n$badge`n", [Text.UTF8Encoding]::new($false))
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "AlcMute $env:GITHUB_REF_NAME" --notes-file $notesPath "dist/AlcMute-$version-Setup.exe" "dist/AlcMute-$version-Portable.zip" dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
