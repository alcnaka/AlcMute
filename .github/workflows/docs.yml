name: Documentation
on:
  workflow_dispatch:
  push:
    paths: ['docs/user-guide*.md', 'docs/screenshots/**', 'scripts/docs/**', 'website/**', 'assets/app.png', 'Cargo.toml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/user-guide*.md', 'docs/screenshots/**', 'scripts/docs/**', 'website/**', 'assets/app.png', 'Cargo.toml', '.github/workflows/docs.yml']
permissions:
  contents: read
jobs:
  documentation:
    runs-on: windows-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt
      - run: python -m pip install -r scripts/docs/requirements.txt
      - run: python scripts/docs/build.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm --dir website build
      - run: python scripts/docs/verify.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: alcmute-documentation
          path: output/
          if-no-files-found: error
