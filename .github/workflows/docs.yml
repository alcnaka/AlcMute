name: Documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths: ['docs/user-guide*.md', 'docs/screenshots/**', 'scripts/docs/**', 'website/**', 'assets/app.png', 'assets/mic-*.svg', 'Cargo.toml', '.github/workflows/docs.yml']
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  documentation:
    runs-on: windows-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      RAYON_NUM_THREADS: '1'
      DOCS_BASE_PATH: /${{ github.event.repository.name }}/
      DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt
      - run: python -m pip install -r scripts/docs/requirements.txt
      - run: python -m unittest discover -s scripts/docs -p "test_*.py"
      - run: python scripts/docs/build.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm --dir website build
      - run: python scripts/docs/verify.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: alcmute-documentation
          path: output/
          if-no-files-found: error
      - name: Upload GitHub Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: documentation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
