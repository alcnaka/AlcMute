[package]
name = "alcmute-core"
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false

[features]
installer = []
dev-tools = []
windows-integration = ["dep:windows-sys", "dep:ureq", "dep:serde_json", "dep:winreg"]

[dependencies]
semver = "1"
sha2 = "0.10"
url = "2"
rosc = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
global-hotkey = "0.9"
serde_json = { version = "1", optional = true }
ureq = { version = "3", default-features = false, features = ["json", "rustls"], optional = true }
winreg = { version = "0.55", optional = true }
windows-sys = { version = "0.59", optional = true, features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Memory", "Win32_Security_Authorization", "Win32_Foundation", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
